<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Todorov Tees Blog</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img src="assets/img/logo.png" alt="Todorov Tees">
    </a>
    <nav class="site-nav">
      <a href="https://todorovtees.com/">Магазин</a>
      <a href="index.html"><span class="tag-dot"></span>Блог</a>
    </nav>
  </div>
</header>

<div id="post-root">
  <div class="wrap" style="padding:90px 0;text-align:center;">
    <p class="spinner-text">Зареждане…</p>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <span class="footer-mark">© <span id="year"></span> Todorov Tees</span>
    <span><a href="https://todorovtees.com/">todorovtees.com</a> &middot; <a href="https://www.instagram.com/todorov.tees/">Instagram</a></span>
  </div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const params = new URLSearchParams(window.location.search);
const slug = params.get('slug');
const root = document.getElementById('post-root');

if (!slug) {
  root.innerHTML = notFoundHtml();
} else {
  fetch('posts.json?t=' + Date.now())
    .then(r => r.json())
    .then(posts => {
      const published = posts.filter(p => p.published).sort((a,b) => new Date(b.date) - new Date(a.date));
      const idx = published.findIndex(p => p.slug === slug);
      const post = idx >= 0 ? published[idx] : null;
      if (!post) { root.innerHTML = notFoundHtml(); return; }

      document.getElementById('page-title').textContent = post.title + ' — Todorov Tees Blog';
      root.innerHTML = `
        <div class="post-header">
          <div class="grain"></div>
          <div class="wrap">
            <div class="meta-row">
              <span class="drop-no">DROP N° ${String(published.length - idx).padStart(3, '0')}</span>
              <span>${formatDate(post.date)}</span>
              ${post.category ? `<span>${escapeHtml(post.category)}</span>` : ''}
            </div>
            <h1>${escapeHtml(post.title)}</h1>
          </div>
        </div>
        <div class="wrap">
          ${post.cover_image ? `<img class="post-cover" src="${post.cover_image}" alt="${escapeHtml(post.title)}">` : ''}
          <article class="post-content">${post.content}</article>
          <a class="back-link" href="index.html">← Към всички статии</a>
        </div>
      `;
    })
    .catch(() => { root.innerHTML = notFoundHtml(true); });
}

function notFoundHtml(loadError) {
  return `<div class="wrap" style="padding:90px 0;text-align:center;">
            <h1>404</h1>
            <p class="spinner-text">${loadError ? 'Грешка при зареждане на статиите.' : 'Тази статия не съществува или е премахната.'}</p>
            <a class="back-link" href="index.html">← Към блога</a>
          </div>`;
}
function formatDate(d) {
  return new Date(d).toLocaleDateString('bg-BG', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
